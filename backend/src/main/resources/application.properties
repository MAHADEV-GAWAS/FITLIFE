# FitLife - Spring Boot Configuration

# Server configuration
server.port=8080

# MySQL Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/fitlife
spring.datasource.username=root
spring.datasource.password=ChooseYourOwnPassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show SQL queries in the console for easy learning and college demo
logging.level.com.fitlife=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# Spring Web configuration
spring.mvc.format.date-time=iso